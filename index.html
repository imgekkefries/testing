<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'BlackRotting';
      src: url('BlackRotting.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --ink: #fafafa;
      --hand-width: 55vw;
      --rest-gap: 24vw;
      --right-shift: 4vw;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    html {
      background: #000000;
      image-rendering: pixelated;
    }

    body {
      background: #000000;
      color: var(--ink);
      position: fixed;
      inset: 0;
      cursor: pointer;
      filter: contrast(1.06) saturate(0.92) brightness(0.96);
    }

    /* =========================================================
       HANDS
       ========================================================= */
    .hand {
      position: fixed;
      top: 50%;
      width: var(--hand-width);
      height: auto;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
      filter: grayscale(1) contrast(1.9) brightness(1.1);

      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
    }

    .hand-left {
      left: 0;
      transform: translateY(-50%) translateX(-100vw);
    }

    .hand-right {
      right: 0;
      transform: translateY(-50%) translateX(100vw);
    }

    body.ready .hand {
      opacity: 1;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
    }

    body.ready .hand-left {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--rest-x-left, 0px));
    }

    body.ready .hand-right {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--rest-x-right, 0px));
    }

    /* Touch State */
    body.ready.touching .hand-left {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--touch-x-left, 0px));
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    body.ready.touching .hand-right {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--touch-x-right, 0px));
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Pull Back State */
    body.sequence-active .hand-left {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--rest-x-left, 0px)) !important;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    body.sequence-active .hand-right {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--rest-x-right, 0px)) !important;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Exit: hands slide fully off their respective sides, fading while moving */
    body.hands-exiting .hand-left {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(-110vw) !important;
      opacity: 0 !important;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    body.hands-exiting .hand-right {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(110vw) !important;
      opacity: 0 !important;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* =========================================================
       CLICK HINT — no box, no label, just the word
       ========================================================= */
    #click-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateY(5vw);
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    body.ready #click-hint {
      opacity: 1;
      transition-delay: 0.8s;
    }

    body.has-clicked #click-hint {
      opacity: 0;
      transition-delay: 0s;
    }

    .hint-box {
      position: relative;
      display: inline-block;
      padding: 0.7em 1.3em;
    }

    .hint-text {
      font-family: 'Cormorant Garamond', 'Pirata One', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(20px, 2.8vw, 30px);
      color: #ffffff;
      letter-spacing: 0.14em;
      text-transform: lowercase;
      line-height: 1;
      text-shadow: 0 0 22px rgba(255,255,255,0.25);
    }

    /* =========================================================
       SEQUENCE ANIMATIONS (Glow + Text) — the intro click reveal
       ========================================================= */
    #sequence-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }

    body.hands-exiting #sequence-container {
      opacity: 0;
      transition: opacity 1s ease;
    }

    .glow {
      width: 10vw;
      height: 10vw;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0;
      transform: scale(0);
      transition: all 0.4s ease-out;
    }

    body.sequence-glow .glow {
      opacity: 0.9;
      transform: scale(1);
      width: 10vw;
      height: 10vw;
      border-radius: 50%;
      transition: all 0.4s ease-out;
    }

    body.sequence-stretch .glow {
      opacity: 0.85;
      width: 60vw;
      height: 6vw;
      border-radius: 50%;
      transform: scale(1);
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                  height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.sequence-fade .glow {
      animation: glow-dim 1.5s ease-in-out forwards;
    }

    @keyframes glow-dim {
      from { opacity: 0.85; }
      to   { opacity: 0.3; }
    }

    .title-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(calc(-50% + var(--title-dx, 0px)), -50%);
      font-family: 'Pirata One', serif;
      font-size: clamp(14px, 6vw, 96px);
      color: #ffffff;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      z-index: 3;
    }

    body.sequence-text .title-text {
      opacity: 1;
      transform: translate(calc(-50% + var(--title-dx, 0px)), -50%) scale(1.05);
    }

    /* =========================================================
       FINAL PAGE
       ========================================================= */
    .site-title {
      position: fixed;
      top: 3vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-family: 'Pirata One', serif;
      font-size: clamp(48px, min(max(18vw, 80px), 25vh), 240px);
      color: #ffffff;
      letter-spacing: 0.04em;
      text-align: center;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    body.head-visible .site-title {
      opacity: 1;
    }

    .site-title .ch {
      display: inline-block;
      will-change: transform;
    }

    /* ---- UP-HAND WRAPPER ---- */
    #head-wrap {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 100%);
      z-index: 4;
      pointer-events: none;
      transition: transform 1.6s cubic-bezier(0.22, 1, 0.36, 1);
      display: block;
      line-height: 0;
    }

    body.head-visible #head-wrap {
      transform: translate(-50%, 0);
    }

    #head-img {
      display: block;
      height: 92vh;
      width: auto;
      max-width: none;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-drag: none;
      filter: grayscale(1) contrast(1.9) brightness(1.1);
    }

    /* =========================================================
       SIDE COLUMNS
       ========================================================= */
    .info-col,
    #right-stack {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease, visibility 0s linear 0.6s;
    }

    body.head-visible .info-col,
    body.head-visible #right-stack {
      opacity: 1;
      transition-delay: 0.3s, 0s;
    }

    body.uphand-visible #playlist-col,
    body.uphand-visible #right-stack {
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.6s ease, visibility 0s linear 0s;
    }

    #playlist-col {
      text-align: right;
      max-width: none;
    }

    .fit-inner {
      width: 300px;
    }

    #right-stack .fit-inner {
      display: flex;
      flex-direction: column;
      gap: 1.6em;
      width: 280px;
    }

    #right-stack .info-col {
      position: static;
      transform: none;
      max-width: none;
      opacity: 1;
      visibility: inherit;
      transition: none;
    }

    .col-heading {
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffffff;
      opacity: 0.55;
      margin: 0 0 0.9em 0;
      font-weight: 500;
    }

    #playlist-col .col-heading {
      text-align: right;
    }

    /* ---------------------------------------------------------
       SPOTIFY EMBEDS
       ---------------------------------------------------------
       Playlist embeds fade in sequentially top→bottom, and the
       whole column gets a max-height with scroll so it can never
       overflow the available vertical space. */
    .playlist-embeds {
      display: flex;
      flex-direction: column;
      gap: 0.6em;
      max-height: 60vh;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.25) transparent;
      -webkit-overflow-scrolling: touch;
      /* fade mask at top & bottom edges so scrolling feels soft */
      -webkit-mask-image: linear-gradient(to bottom,
        transparent 0,
        #000 12px,
        #000 calc(100% - 12px),
        transparent 100%);
              mask-image: linear-gradient(to bottom,
        transparent 0,
        #000 12px,
        #000 calc(100% - 12px),
        transparent 100%);
    }

    .playlist-embeds::-webkit-scrollbar {
      width: 4px;
    }
    .playlist-embeds::-webkit-scrollbar-track {
      background: transparent;
    }
    .playlist-embeds::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
    }

    .spotify-embed {
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      filter: grayscale(1) contrast(1.35) brightness(0.9);
      transition: filter 0.25s ease,
                  opacity 0.55s ease,
                  transform 0.55s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0;
      transform: translateY(-10px);
    }

    /* staggered top→bottom reveal */
    body.uphand-visible #playlist-col .spotify-embed {
      opacity: 1;
      transform: translateY(0);
    }
    body.uphand-visible #playlist-col .spotify-embed:nth-child(1) { transition-delay: 0.15s, 0.15s, 0.15s; }
    body.uphand-visible #playlist-col .spotify-embed:nth-child(2) { transition-delay: 0.30s, 0.30s, 0.30s; }
    body.uphand-visible #playlist-col .spotify-embed:nth-child(3) { transition-delay: 0.45s, 0.45s, 0.45s; }
    body.uphand-visible #playlist-col .spotify-embed:nth-child(4) { transition-delay: 0.60s, 0.60s, 0.60s; }

    .spotify-embed:hover {
      filter: grayscale(1) contrast(1.5) brightness(1.05);
    }

    .spotify-embed iframe {
      display: block;
      width: 100%;
      height: 80px;
      border: 0;
    }

    .info-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .info-list li {
      font-size: 18px;
      letter-spacing: 0.05em;
      color: #ffffff;
      line-height: 1.4;
      margin: 0.7em 0;
      position: relative;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .info-list li.typed {
      opacity: 0.92;
    }

    #projects-list li {
      min-height: 1.4em;
      pointer-events: none;
      cursor: pointer;
      text-transform: uppercase;
    }

    #projects-list li.selectable {
      pointer-events: auto;
    }

    #projects-list li::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -0.18em;
      height: 1.5px;
      width: 100%;
      background: #ffffff;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    #projects-list li.selectable:hover::after {
      clip-path: inset(0 0 0 0);
    }

    #socials-list li {
      cursor: pointer;
      text-transform: uppercase;
    }

    #socials-list li a,
    #socials-list li span.mail-link {
      color: #ffffff;
      text-decoration: none;
      display: inline-block;
      position: relative;
    }

    #socials-list li a::after,
    #socials-list li span.mail-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -0.18em;
      height: 1.5px;
      width: 100%;
      background: #ffffff;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    #socials-list li a:hover::after,
    #socials-list li span.mail-link:hover::after {
      clip-path: inset(0 0 0 0);
    }

    .info-list li .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1em;
      background: #ffffff;
      margin-left: 0.15em;
      vertical-align: -0.12em;
      animation: blink 0.7s steps(1) infinite;
    }

    @keyframes blink {
      0%, 50%   { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    /* =========================================================
       1990s CRT SCREEN-QUALITY TREATMENT
       ========================================================= */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9996;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(255, 200, 130, 0.03) 0%, rgba(0, 0, 0, 0) 70%),
        rgba(90, 70, 40, 0.02);
      mix-blend-mode: screen;
    }

    #tv-static {
      position: fixed;
      inset: 0;
      z-index: 9997;
      pointer-events: none;
      opacity: 0.10;
      overflow: hidden;
      background-image:
        radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.6) 0.5px, transparent 0.6px),
        radial-gradient(rgba(200,200,200,0.5) 0.5px, transparent 0.6px);
      background-size: 3px 3px, 5px 5px, 7px 7px;
      background-position: 0 0, 1px 2px, 3px 1px;
      will-change: background-position, opacity;
    }

    #crt-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.10) 0px,
          rgba(0, 0, 0, 0.10) 1px,
          rgba(0, 0, 0, 0.00) 1px,
          rgba(0, 0, 0, 0.00) 3px
        ),
        repeating-linear-gradient(
          to right,
          rgba(255, 0, 0, 0.015) 0px,
          rgba(255, 0, 0, 0.015) 1px,
          rgba(0, 255, 0, 0.015) 1px,
          rgba(0, 255, 0, 0.015) 2px,
          rgba(0, 0, 255, 0.015) 2px,
          rgba(0, 0, 255, 0.015) 3px
        );
      mix-blend-mode: multiply;
      animation: crt-flicker 0.18s infinite steps(2);
    }

    @keyframes crt-flicker {
      0%   { opacity: 0.98; }
      50%  { opacity: 1.00; }
      100% { opacity: 0.98; }
    }

    /* =========================================================
       MOBILE OVERRIDES
       ========================================================= */
    @media (max-width: 768px) {
      .hint-box {
        padding: 0.4em 0.7em;
      }
      .hint-text {
        font-size: 20px;
      }

      #playlist-col { display: none !important; }

      #right-stack {
        left: auto;
        right: 4vw;
        text-align: right;
      }
      #right-stack .fit-inner { gap: 2.2em; }
      #right-stack .info-col { text-align: right; }
      #projects-list li::after,
      #socials-list li a::after,
      #socials-list li span.mail-link::after {
        left: auto; right: 0;
      }
      .col-heading { text-align: right; }
      #projects-list li,
      #socials-list li { text-align: right; }

      .info-list li {
        font-size: 17px;
        letter-spacing: 0.06em;
        margin: 0.85em 0;
        line-height: 1.45;
      }
      .col-heading {
        font-size: 14px;
        letter-spacing: 0.22em;
        margin-bottom: 0.9em;
      }
    }

    @media (max-width: 420px) {
      .info-list li {
        font-size: 15px;
        margin: 0.7em 0;
      }
      .col-heading {
        font-size: 13px;
        margin-bottom: 0.7em;
      }
      #right-stack .fit-inner { gap: 1.8em; }
    }
  </style>
</head>

      function buildArchedTitle() {
        if (!siteTitle) return;
        siteTitle.innerHTML = '';
        siteTitleChars = [];
        for (let i = 0; i < SITE_TITLE_TEXT.length; i++) {
          const span = document.createElement('span');
          span.className = 'ch';
          span.textContent = SITE_TITLE_TEXT[i];
          siteTitle.appendChild(span);
          siteTitleChars.push(span);
        }
        applyArch();
      }

      function applyArch() {
        if (!siteTitle || !siteTitleChars.length) return;
        const n = siteTitleChars.length;
        if (n < 2) return;

        const fsPx = parseFloat(getComputedStyle(siteTitle).fontSize) || 120;
        const depth = fsPx * 0.10;

        for (let i = 0; i < n; i++) {
          const t = (i / (n - 1)) * 2 - 1;
          const lift = depth * (t * t);
          siteTitleChars[i].style.transform = `translateY(${lift - depth * 0.5}px)`;
        }
      }

      // ---------------------------------------------------------
      // BFCACHE / REFRESH SAFETY
      // ---------------------------------------------------------
      function releaseHands() {
        [leftImg, rightImg].forEach((img) => {
          if (img) img.removeAttribute('src');
        });
      }
      window.addEventListener('pagehide', releaseHands);
      window.addEventListener('beforeunload', releaseHands);
      window.addEventListener('pageshow', (e) => {
        if (e.persisted) location.reload();
      });

      // ---------------------------------------------------------
      // ROBUST HAND LOADER
      // ---------------------------------------------------------
      function loadHand(img, src, attempt) {
        attempt = attempt || 0;
        return new Promise((resolve) => {
          let settled = false;

          function cleanup() {
            img.removeEventListener('load', onLoad);
            img.removeEventListener('error', onFail);
          }
          function finish(ok) {
            if (settled) return;
            settled = true;
            cleanup();
            resolve(ok);
          }
          function retry() {
            if (settled) return;
            settled = true;
            cleanup();
            if (attempt >= 4) { resolve(false); return; }
            img.removeAttribute('src');
            setTimeout(() => {
              loadHand(img, src + '?r=' + Date.now() + '_' + attempt, attempt + 1)
                .then(resolve);
            }, 250 * (attempt + 1));
          }
          function onFail() { retry(); }
          function onLoad() {
            if (!img.naturalWidth) { retry(); return; }
            if (typeof img.decode === 'function') {
              img.decode().then(() => {
                if (img.naturalWidth) finish(true); else retry();
              }).catch(retry);
            } else {
              finish(true);
            }
          }

          img.addEventListener('load', onLoad);
          img.addEventListener('error', onFail);
          img.src = src;
          if (img.complete && img.naturalWidth) onLoad();
        });
      }

      // ---------------------------------------------------------
      // SPOTIFY EMBEDS
      // ---------------------------------------------------------
      function fitSpotifyEmbeds() {
        const embeds = document.querySelectorAll('.spotify-embed');
        if (!embeds.length) return;
        const mobile = isMobile();

        embeds.forEach((embed) => {
          const iframe = embed.querySelector('iframe');
          if (!iframe) return;
          embed.style.height = '';
          iframe.style.position = '';
          iframe.style.top = '';
          iframe.style.left = '';
          iframe.style.transform = '';
          iframe.style.transformOrigin = '';
          iframe.style.width = '';
          iframe.style.height = '';
          if (!mobile) iframe.style.height = '80px';
        });
      }

      // ---------------------------------------------------------
      // UPHAND NATURAL COORDINATES
      // ---------------------------------------------------------
      const UPHAND_NAT = {
        tipX: 592,
        tipY: 0,
        leftEdgeX: 344,
        rightEdgeX: 778,
      };

      const UPHAND_TIP_TOP_VH = 26;

      function computeUphandLayout() {
        if (!headImg || !headImg.naturalWidth) return null;

        const natW = headImg.naturalWidth;
        const natH = headImg.naturalHeight;
        if (!natW || !natH) return null;

        const H = window.innerHeight;
        const W = window.innerWidth;

        const tipTopPx = H * (UPHAND_TIP_TOP_VH / 100);
        const renderedH = Math.max(1, H - tipTopPx);
        const scale = renderedH / natH;
        const renderedW = natW * scale;

        const handCenterNatX = (UPHAND_NAT.leftEdgeX + UPHAND_NAT.rightEdgeX) / 2;
        const handCenterRenderedX = handCenterNatX * scale;

        const wrapCenterX = W / 2;
        const imageLeftIfCentered = wrapCenterX - renderedW / 2;
        const handCenterIfCentered = imageLeftIfCentered + handCenterRenderedX;
        const shiftX = wrapCenterX - handCenterIfCentered;

        const handLeftVP  = imageLeftIfCentered + UPHAND_NAT.leftEdgeX  * scale + shiftX;
        const handRightVP = imageLeftIfCentered + UPHAND_NAT.rightEdgeX * scale + shiftX;

        return {
          natW, natH, scale, renderedW, renderedH, shiftX,
          handLeftVP, handRightVP,
          tipTopPx
        };
      }

      function fitUphand() {
        if (!headImg) return;
        const layout = computeUphandLayout();
        if (!layout) { fitColumns(null); return; }

        headImg.style.height = layout.renderedH + 'px';
        headImg.style.width  = layout.renderedW + 'px';

        headWrap.style.transform = '';
        headWrap.style.left = '50%';
        headWrap.style.setProperty('--uphand-shift-x', layout.shiftX + 'px');

        fitColumns(layout);
      }

      // ---------------------------------------------------------
      // ADAPTIVE COLUMNS
      // ---------------------------------------------------------
      function fitColumn(outer, natW, availW, maxZoom, zoneTop, zoneH) {
        const inner = outer.querySelector('.fit-inner');
        if (!inner) return;
        inner.style.zoom = 1;
        inner.style.width = natW + 'px';
        const natH = inner.offsetHeight || 1;
        let z = Math.min(maxZoom, availW / natW, zoneH / natH);
        if (!isFinite(z)) z = 1;
        z = Math.max(0.3, z);
        inner.style.zoom = z;
        const h = natH * z;
        outer.style.top = (zoneTop + Math.max(0, (zoneH - h) / 2)) + 'px';
        outer.style.transform = 'none';
      }

      function fitColumns(layout) {
        const W = window.innerWidth;
        const H = window.innerHeight;
        const mobile = isMobile();
        if (!mobile && !layout) return;

        const titleBottom = siteTitle ? siteTitle.getBoundingClientRect().bottom : 0;
        const gapV = Math.max(8, H * 0.02);
        const zoneTop = Math.min(titleBottom + gapV, H * 0.7);
        const zoneBottom = H - Math.max(10, H * 0.03);
        const zoneH = Math.max(60, zoneBottom - zoneTop);
        const sideMargin = Math.max(10, W * 0.02);

        if (mobile) {
          if (rightStack) {
            const natW = W * (W <= 420 ? 0.62 : 0.6);
            fitColumn(rightStack, natW, W * 0.92, 1, zoneTop, zoneH);
            rightStack.style.left = '';
          }
          if (playlistCol) playlistCol.style.right = '';
          return;
        }

        const GAP = Math.max(12, W * 0.02);
        const handLeft  = layout.handLeftVP;
        const handRight = layout.handRightVP;

        if (playlistCol) {
          const availW = handLeft - GAP - sideMargin;
          fitColumn(playlistCol, 300, availW, 1.5, zoneTop, zoneH);
          playlistCol.style.right = (W - (handLeft - GAP)) + 'px';
        }
        if (rightStack) {
          const availW = W - (handRight + GAP) - sideMargin;
          fitColumn(rightStack, 280, availW, 1.5, zoneTop, zoneH);
          rightStack.style.left = (handRight + GAP) + 'px';
        }
      }

      // ---------------------------------------------------------
      // MAIL COPY
      // ---------------------------------------------------------
      if (socialsList) {
        const mailSpan = socialsList.querySelector('.mail-link');
        if (mailSpan) {
          mailSpan.addEventListener('click', function (e) {
            e.preventDefault();
            const mail = this.getAttribute('data-mail') || 'gekkefries@proton.me';
            navigator.clipboard.writeText(mail).then(() => {
              const originalText = this.textContent;
              this.textContent = 'COPIED!';
              setTimeout(() => { this.textContent = originalText; }, 1200);
            }).catch(() => {
              const ta = document.createElement('textarea');
              ta.value = mail;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              const originalText = this.textContent;
              this.textContent = 'COPIED!';
              setTimeout(() => { this.textContent = originalText; }, 1200);
            });
          });
        }
      }

      function getFingertipGapPx() {
        const W = window.innerWidth;
        const restGapStr = getComputedStyle(document.documentElement).getPropertyValue('--rest-gap').trim();
        const rightShiftStr = getComputedStyle(document.documentElement).getPropertyValue('--right-shift').trim();
        const gapPx = W * (parseFloat(restGapStr) / 100);
        const shiftPx = W * (parseFloat(rightShiftStr) / 100);
        return gapPx + shiftPx;
      }

      function centerTitleBetweenFingertips() {
        if (!titleEl) return;
        const W = window.innerWidth;
        const rightShiftStr = getComputedStyle(document.documentElement).getPropertyValue('--right-shift').trim();
        const shiftPx = W * (parseFloat(rightShiftStr) / 100);
        titleEl.style.setProperty('--title-dx', (shiftPx / 2) + 'px');
      }

      function fitTitleText() {
        if (!titleEl) return;
        centerTitleBetweenFingertips();
        const W = window.innerWidth;
        const H = window.innerHeight;
        const gapPx = getFingertipGapPx();
        const availableWidth = Math.max(gapPx, W * 0.3) * 0.82;
        const availableHeight = H * 0.22;
        const REF_SIZE = 100;
        const prevInlineSize = titleEl.style.fontSize;
        titleEl.style.fontSize = REF_SIZE + 'px';
        const rect = titleEl.getBoundingClientRect();
        const natWidth = rect.width;
        const natHeight = rect.height;
        if (!natWidth || !natHeight) {
          titleEl.style.fontSize = prevInlineSize;
          return;
        }
        const scaleByWidth = availableWidth / natWidth;
        const scaleByHeight = availableHeight / natHeight;
        const scale = Math.min(scaleByWidth, scaleByHeight);
        let finalSize = REF_SIZE * scale;
        finalSize = Math.max(14, Math.min(finalSize, 110));
        titleEl.style.fontSize = finalSize + 'px';
      }

      function ready(img, cb) {
        if (img.complete && img.naturalWidth) cb();
        else img.addEventListener('load', cb, { once: true });
      }

      function recomputeHands() {
        const W = window.innerWidth;
        const lh = leftImg.getBoundingClientRect();
        const rh = rightImg.getBoundingClientRect();
        if (!lh.width || !rh.width) return false;
        const natW_L = leftImg.naturalWidth;
        const natW_R = rightImg.naturalWidth;
        if (!natW_L || !natW_R) return false;
        const L_TIP_X = 2150, L_TIP_Y = 281;
        const R_TIP_X = 3,    R_TIP_Y = 493;
        const scaleL = lh.width / natW_L;
        const scaleR = rh.width / natW_R;
        const lTipLocalX = L_TIP_X * scaleL;
        const lTipLocalY = L_TIP_Y * scaleL;
        const rTipLocalX = R_TIP_X * scaleR;
        const rTipLocalY = R_TIP_Y * scaleR;
        const lCenterOffset = lTipLocalY - lh.height / 2;
        const rCenterOffset = rTipLocalY - rh.height / 2;
        const targetOffset = (lCenterOffset + rCenterOffset) / 2;
        const leftDY  = targetOffset - lCenterOffset;
        const rightDY = targetOffset - rCenterOffset;
        const restGapStr = getComputedStyle(document.documentElement).getPropertyValue('--rest-gap').trim();
        const rightShiftStr = getComputedStyle(document.documentElement).getPropertyValue('--right-shift').trim();
        const gapPx = W * (parseFloat(restGapStr) / 100);
        const shiftPx = W * (parseFloat(rightShiftStr) / 100);
        const leftRestX = (W / 2) - (gapPx / 2) - lTipLocalX;
        const rightRestX = (W / 2) + (gapPx / 2) + shiftPx - ((W - rh.width) + rTipLocalX);
        const leftTouchX  = (W / 2) - lTipLocalX;
        const rightTouchX = (W / 2) - ((W - rh.width) + rTipLocalX);
        leftImg.style.setProperty('--dy', leftDY + 'px');
        rightImg.style.setProperty('--dy', rightDY + 'px');
        leftImg.style.setProperty('--rest-x-left', leftRestX + 'px');
        rightImg.style.setProperty('--rest-x-right', rightRestX + 'px');
        leftImg.style.setProperty('--touch-x-left', leftTouchX + 'px');
        rightImg.style.setProperty('--touch-x-right', rightTouchX + 'px');
        return true;
      }

      function updateLayout() {
        fitTitleText();
        fitUphand();
        fitSpotifyEmbeds();
        applyArch();
        if (leftImg.style.display === 'none') return;
        const handsOk = recomputeHands();
        if (handsOk && !document.body.classList.contains('ready')) {
          setTimeout(() => {
            document.body.classList.add('ready');
          }, 50);
        }
      }

      let rafPending = false;
      function scheduleUpdate() {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(() => {
          rafPending = false;
          updateLayout();
        });
      }

      buildArchedTitle();

      fitTitleText();

      (async function loadBothHands() {
        await loadHand(leftImg,  leftImg.getAttribute('data-src'));
        await loadHand(rightImg, rightImg.getAttribute('data-src'));
        requestAnimationFrame(updateLayout);
      })();

      ready(headImg, () => { fitUphand(); });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(scheduleUpdate);
      }

      window.addEventListener('resize', scheduleUpdate);
      window.addEventListener('orientationchange', scheduleUpdate);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleUpdate);
        window.visualViewport.addEventListener('scroll', scheduleUpdate);
      }

      function typeList(listEl, { selectable } = {}) {
        return new Promise((resolve) => {
          const items = Array.from(listEl.querySelectorAll('li'));
          function typeItem(i) {
            if (i >= items.length) { resolve(); return; }
            const li = items[i];
            const text = li.getAttribute('data-label') || '';
            li.classList.add('typed');
            if (listEl.id === 'socials-list') { typeItem(i+1); return; }
            li.textContent = '';
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            li.appendChild(cursor);
            let idx = 0;
            const speed = 24;
            function step() {
              if (idx < text.length) {
                cursor.insertAdjacentText('beforebegin', text.charAt(idx));
                idx++;
                setTimeout(step, speed);
              } else {
                cursor.remove();
                if (selectable) li.classList.add('selectable');
                setTimeout(() => typeItem(i + 1), 120);
              }
            }
            step();
          }
          typeItem(0);
        });
      }

      function typeAllLists() {
        typeList(projectsList, { selectable: true }).then(() => {
          projectsList.querySelectorAll('li.selectable').forEach((li) => {
            li.addEventListener('click', () => {
              console.log('Project clicked:', li.textContent.trim());
            });
          });
          const socialsItems = socialsList.querySelectorAll('li');
          socialsItems.forEach((li, i) => {
            setTimeout(() => { li.classList.add('typed'); }, i * 100);
          });
        });
      }

      document.body.addEventListener('click', function () {
        if (!document.body.classList.contains('ready') || sequenceRunning) return;
        sequenceRunning = true;
        document.body.classList.add('has-clicked');
        document.body.classList.add('touching');

        setTimeout(() => { document.body.classList.add('sequence-glow'); }, 600);

        setTimeout(() => {
          document.body.classList.remove('touching');
          document.body.classList.add('sequence-active');
          document.body.classList.add('sequence-stretch');
          setTimeout(() => {
            document.body.classList.add('sequence-text');
            document.body.classList.add('sequence-fade');
          }, 400);
        }, 1600);

        // Title-text now only lingers ~0.5s before the exit.
        setTimeout(() => {
          document.body.classList.add('hands-exiting');
          setTimeout(() => {
            leftImg.removeAttribute('src');
            rightImg.removeAttribute('src');
            leftImg.style.display = 'none';
            rightImg.style.display = 'none';
          }, 1200);

          setTimeout(() => {
            document.body.classList.add('head-visible');
            fitUphand();
            fitSpotifyEmbeds();
            applyArch();

            setTimeout(() => {
              document.body.classList.add('uphand-visible');
              typeAllLists();
            }, 900);
          }, 900);
        }, 5200);
      });
    })();

    (function () {
      const staticEl = document.getElementById('tv-static');
      function tick() {
        const ox = (Math.random() * 10 - 5).toFixed(1);
        const oy = (Math.random() * 10 - 5).toFixed(1);
        staticEl.style.backgroundPosition =
          ox + 'px ' + oy + 'px, ' +
          (Math.random() * 6).toFixed(1) + 'px ' + (Math.random() * 6).toFixed(1) + 'px, ' +
          (Math.random() * 8).toFixed(1) + 'px ' + (Math.random() * 8).toFixed(1) + 'px';
        staticEl.style.opacity = (0.08 + Math.random() * 0.05).toFixed(3);
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>
